name: Frontend

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Tipos globais do App Router (LayoutProps, PageProps, rotas) ficam em
      # .next/types e só existem depois do typegen: sem isso o tsc não acha.
      - name: Gerar tipos do Next
        run: npx next typegen

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Checagem de UI (componentes do design system)
        run: npm run check:ui

      - name: Testes unitários
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
        run: npm run build
