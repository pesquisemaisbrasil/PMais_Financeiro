name: Security

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pip-audit (vulnerabilidades conhecidas nas dependências)
        # Todos no starlette 0.48.0: a correção exige versão maior, e fastapi==0.118.3 trava
        # starlette<0.49. Atualizar o FastAPI é uma mudança própria (handoff/02).
        # - PYSEC-2026-249: AFETA /auth/token. Formulário urlencoded sem limite de tamanho, sem
        #   autenticação. Antes de produção: subir o FastAPI ou limitar o corpo no proxy.
        # - PYSEC-2026-161 e 248: request.url manipulável; só lemos o esquema, para o HSTS.
        # - PYSEC-2026-1942 e 2281: FileResponse e StaticFiles; não usamos.
        # - PYSEC-2026-2280: HTTPEndpoint; não usamos.
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-1942
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (vulnerabilidades conhecidas nas dependências de produção)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLI em vez de gitleaks/gitleaks-action: a action exige licença paga em repositório de
      # organização e permissão de ler PRs. A CLI varre o histórico inteiro e respeita o
      # .gitleaksignore.
      - name: Gitleaks (segredo commitado no histórico)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
