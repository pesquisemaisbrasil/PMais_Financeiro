name: Security

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pip-audit (vulnerabilidades conhecidas nas dependências)
        # Sem exceções: os 6 alertas que eram ignorados eram todos do starlette 0.48.0 e saíram
        # com a subida para fastapi 0.162.0 + starlette 1.10.0 (PF-52).
        run: pip-audit -r requirements.txt

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (vulnerabilidades conhecidas nas dependências de produção)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLI em vez de gitleaks/gitleaks-action: a action exige licença paga em repositório de
      # organização e permissão de ler PRs. A CLI varre o histórico inteiro e respeita o
      # .gitleaksignore.
      - name: Gitleaks (segredo commitado no histórico)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
