name: E2E

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências do backend
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências do frontend
        run: npm ci

      # Sem --with-deps: ele roda apt-get, e o DNS dos espelhos do Ubuntu falha nas máquinas do GitHub.
      # A imagem já traz as bibliotecas dos navegadores; se algum teste acusar biblioteca faltando, voltar o --with-deps.
      - name: Navegador do Playwright
        run: npx playwright install chromium

      - name: Gerar tipos do Next
        run: npx next typegen

      # Sobe backend (SQLite + seed_e2e.py) e frontend pelo playwright.config.ts
      - name: Testes de tela
        env:
          E2E_PYTHON: python
        run: npm run e2e

      # A versão de demonstração (backend no navegador, publicada em /teste no site do protótipo, no
      # Netlify): gera o app estático com o Pyodide e os pacotes de Python, e confere pelas telas.
      # Um erro de exportação estática (ex.: cookies() ou uma rota dinâmica) falha aqui, não no deploy.
      - name: Gerar a demonstração
        run: node scripts/build-demo.mjs

      - name: Testes de tela da demonstração
        run: npx playwright test -c playwright.demo.config.ts

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
