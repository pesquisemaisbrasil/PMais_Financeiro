<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P+ Financeiro · Endereço não encontrado</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Caminhos a partir da raiz: esta página aparece em qualquer endereço que não existe no site. -->
  <link rel="stylesheet" href="/app.css">
  <style>
    body { display: grid; min-height: 100vh; place-items: center; background: var(--muted); }
    .aviso-404 { max-width: 460px; margin: 24px; padding: 28px; background: #fff; border: 1px solid var(--border); border-radius: 16px; text-align: center; }
    .aviso-404 img { box-sizing: content-box; width: 96px; height: auto; margin-bottom: 18px; background: var(--brand-azul-deep); padding: 10px 14px; border-radius: 10px; }
    .aviso-404 h1 { margin: 0 0 8px; font-size: 18px; }
    .aviso-404 p { margin: 0 0 18px; color: #64748b; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="aviso-404">
    <img src="/logo-branco.png" alt="P+ Financeiro">
    <h1>Este endereço ainda não existe neste site</h1>
    <p>
      Se você veio pelo botão <strong>Abrir para teste de produção</strong>, a versão real do Financeiro em teste
      ainda não foi publicada aqui. O protótipo, com dados fictícios, continua funcionando.
    </p>
    <a class="btn" href="/">Voltar ao protótipo</a>
  </main>
</body>
</html>
