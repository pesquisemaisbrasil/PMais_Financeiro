# Servidor local (deploy da branch development, dados reais): banco, cofre de arquivos (MinIO com
# TLS), API, telas e o Caddy, que fica atrás do nginx do servidor (o nginx cuida do HTTPS, como no
# P+ Connect: ADR 0027). Os comandos ficam no Makefile da raiz; o guia é o DEPLOY.md da raiz.
# Segredos e endereços vêm de deploy/.env, gerado por `make configurar` e fora do git.
# Só o Caddy publica porta, e só na própria máquina (127.0.0.1:PORTA_LOCAL, onde o nginx chega);
# banco, MinIO, API e telas ficam na rede interna.
# O docker-compose.yml da raiz continua só para o desenvolvimento.
name: financeiro

# Log com tamanho limitado (5 arquivos de 10 MB por serviço): sem isso, meses de log enchem o disco.
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *logs
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode make configurar}
      POSTGRES_DB: financeiro
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria as roles financeiro_migrator e financeiro_app; o Makefile troca as senhas pelas do .env
      - ../docker/postgres/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *logs
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    restart: unless-stopped
    # Em produção a API só fala https com o cofre: o certificado é gerado por `make configurar`.
    command: server /data --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?rode make configurar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?rode make configurar}
    volumes:
      - miniodata:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    <<: *logs
    image: cgr.dev/chainguard/minio-client@sha256:1dccd2a6fd59914a98ac2d9dad95e552c91243cb0bd7242aaa224802df4b3432
    environment:
      MC_HOST_local: https://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    # --insecure: só esta chamada, de container para container, que cria o bucket se faltar
    command: ["mb", "--insecure", "--ignore-existing", "local/financeiro-arquivos"]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  api:
    <<: *logs
    build: ../backend
    restart: unless-stopped
    environment:
      # Produção: sem /docs, Connect só por https, sem dados de exemplo nem Connect simulado.
      ENVIRONMENT: production
      DATABASE_URL: postgresql://financeiro_app:${FINANCEIRO_APP_PASSWORD:?rode make configurar}@db:5432/financeiro
      MIGRATION_DATABASE_URL: postgresql://financeiro_migrator:${FINANCEIRO_MIGRATOR_PASSWORD:?rode make configurar}@db:5432/financeiro
      SECRET_KEY: ${SECRET_KEY:?rode make configurar}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?rode make configurar}
      PIX_SECRET_KEY: ${PIX_SECRET_KEY:?rode make configurar}
      FILES_MASTER_KEY: ${FILES_MASTER_KEY:?rode make configurar}
      FILES_ENDPOINT_URL: https://minio:9000
      FILES_BUCKET: financeiro-arquivos
      # shortcut: a API usa o administrador do MinIO (como no compose de desenvolvimento, ADR 0010);
      # um usuário restrito ao bucket entra quando houver mais de um sistema no mesmo MinIO.
      FILES_ACCESS_KEY: ${MINIO_ROOT_USER}
      FILES_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # o boto3 confia no certificado do MinIO por esta variável
      AWS_CA_BUNDLE: /certs/public.crt
      API_PUBLIC_URL: https://${DOMINIO_API:?rode make configurar}
      FRONTEND_URL: https://${DOMINIO:?rode make configurar}
      CORS_ORIGINS: https://${DOMINIO}
      REFRESH_COOKIE_SECURE: "true"
      # só o Caddy alcança a API (a porta dela não é publicada): confia no IP que ele repassa, que é
      # o que o nginx recebeu
      FORWARDED_ALLOW_IPS: "*"
      CONNECT_BASE_URL: ${CONNECT_BASE_URL:-}
      CONNECT_CLIENT_ID: ${CONNECT_CLIENT_ID:-}
      CONNECT_CLIENT_SECRET: ${CONNECT_CLIENT_SECRET:-}
      PAYMENT_DISPATCH_SECONDS: ${PAYMENT_DISPATCH_SECONDS:-0}
      CNPJ_LOOKUP_MODE: ${CNPJ_LOOKUP_MODE:-brasilapi}
      HOLIDAYS_LOOKUP_MODE: ${HOLIDAYS_LOOKUP_MODE:-brasilapi}
      # feriados estaduais e municipais das capitais, buscados sozinhos a cada 6 horas (ADR 0024)
      FERIADOS_DEV_URL: http://feriados:3000
      HOLIDAYS_SYNC_HOURS: ${HOLIDAYS_SYNC_HOURS:-6}
      HOLIDAYS_LOCATIONS: ${HOLIDAYS_LOCATIONS:-}
    volumes:
      - ./certs/public.crt:/certs/public.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Feriados estaduais e municipais das capitais: o feriados.dev (código aberto, MIT), na versão
  # 2e5e787 de 10/10/2026, com o banco dele. Só na rede interna: nenhuma porta publicada (ADR 0024).
  feriados-db:
    <<: *logs
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: feriados
      POSTGRES_USER: feriados
      # só dados públicos (feriados e cidades), e o banco não sai da rede interna
      POSTGRES_PASSWORD: ${FERIADOS_DB_PASSWORD:-feriados}
    volumes:
      - feriadosdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feriados -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  feriados:
    <<: *logs
    build:
      context: https://github.com/feriados-dev/feriados-dev-oss.git#2e5e7879785a59f304bcc258e056d11819754d83
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # as datas saem como meia-noite em UTC; a API do Financeiro lê o dia antes do "T"
      TZ: UTC
      DATABASE_URL: postgres://feriados:${FERIADOS_DB_PASSWORD:-feriados}@feriados-db:5432/feriados?sslmode=disable
      SWAGGER_ENABLED: "false"
    # cria as tabelas na primeira vez, carrega os dados novos da versão e sobe a API
    command: sh -c "node /app/preparar-banco.cjs && node scripts/run-sql-migrations.mjs && node dist/server.js"
    volumes:
      - ./feriados/preparar-banco.cjs:/app/preparar-banco.cjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      feriados-db: { condition: service_healthy }

  frontend:
    <<: *logs
    build:
      context: ../frontend
      args:
        # o endereço que o NAVEGADOR alcança; trocar o DOMINIO_API pede um build novo (make subir faz)
        NEXT_PUBLIC_API_URL: https://${DOMINIO_API:?rode make configurar}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      api: { condition: service_healthy }

  proxy:
    <<: *logs
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?rode make configurar}
      DOMINIO_API: ${DOMINIO_API:?rode make configurar}
    # só na própria máquina: quem chega aqui é o nginx (deploy/nginx/financeiro.conf)
    ports: ["127.0.0.1:${PORTA_LOCAL:-8089}:80"]
    healthcheck:
      # a API de administração do Caddy, que só escuta dentro do container
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # estado interno do Caddy (o certificado é do nginx)
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }

  # Só para o backup e a restauração dos arquivos (make backup / make restaurar-arquivos).
  ferramentas:
    <<: *logs
    image: postgres:16
    profiles: ["ferramentas"]
    volumes:
      - miniodata:/dados
      - ../backups:/backup

volumes:
  pgdata:
  miniodata:
  feriadosdata:
  caddydata:
  caddyconfig:
