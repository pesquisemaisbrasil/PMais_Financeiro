# Financeiro atrás do nginx que já existe no servidor (ADR 0027), como o P+ Connect.
# O nginx já usa as portas 80 e 443 para outros sistemas; ele recebe os dois endereços do
# Financeiro, cuida do HTTPS (certbot) e repassa ao Caddy do Financeiro, que escuta só em
# 127.0.0.1:PORTA_LOCAL (8089, se o deploy/.env não disser outra).
#
# Este é o modelo: o `make nginx` preenche {{DOMINIO}}, {{DOMINIO_API}} e {{PORTA_LOCAL}} com os do
# deploy/.env e gera financeiro.nginx.conf na raiz do repositório (fora do git). Instalar (como
# root), uma vez, com os comandos que o `make nginx` mostra:
#   cp financeiro.nginx.conf /etc/nginx/sites-available/financeiro.conf
#   ln -s /etc/nginx/sites-available/financeiro.conf /etc/nginx/sites-enabled/financeiro.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx --redirect -d <DOMINIO> -d <DOMINIO_API>
# O certbot pega o certificado, acrescenta o HTTPS neste arquivo (no /etc/nginx, não no repo) e
# passa a redirecionar o HTTP. Ele mesmo renova.

server {
    listen 80;
    server_name {{DOMINIO}} {{DOMINIO_API}};

    # Sem log de acesso: IP é dado pessoal (mesma regra do Caddy e da API).
    access_log off;

    # Maior envio do sistema: uma parte do PDF de comprovantes, 25 MB (o padrão do nginx é 1 MB).
    client_max_body_size 30m;
    # A leitura do PDF de comprovantes e as exportações em Excel podem passar de 1 minuto.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # Aberto pela internet, como o Connect (26/11/2026, Q64): quem protege é o login, com
        # senha, autenticador e computador liberado, e o limite de tentativas da API.
        proxy_pass http://127.0.0.1:{{PORTA_LOCAL}};
        proxy_http_version 1.1;
        # Host intacto: o Caddy escolhe telas ou API por ele.
        proxy_set_header Host $host;
        # Substitui (não acrescenta) o que o cliente mandou: ninguém forja o próprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
